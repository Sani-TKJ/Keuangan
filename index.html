<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Keuangan Saya</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="label">KEUANGAN SAYA</p>
      <h1>Dashboard Keuangan</h1>
      <p class="subtitle">Pantau pemasukan dan pengeluaran kamu.</p>
    </header>

    <section class="balance-card">
      <span>Saldo Tersedia</span>
      <h2 id="balance">Rp0</h2>
      <p>Total pemasukan: <strong id="income">Rp0</strong></p>
    </section>

    <section class="stats">
      <div class="stat">
        <span>📥 Pemasukan</span>
        <strong id="incomeStat">Rp0</strong>
      </div>
      <div class="stat">
        <span>📤 Pengeluaran</span>
        <strong id="expense">Rp0</strong>
      </div>
    </section>

    <section class="transactions">
      <div class="section-header">
        <h2>Riwayat Transaksi</h2>
        <button type="button" id="refreshButton">↻ Refresh</button>
      </div>
      <p class="subtitle">Website ini hanya untuk melihat data. Tambah, edit, dan hapus transaksi dilakukan lewat bot WhatsApp.</p>
      <div id="transactionList">
        <div class="loading">Memuat transaksi...</div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
